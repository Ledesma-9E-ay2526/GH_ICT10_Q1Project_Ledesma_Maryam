<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Poppins:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
    <title>SKU + Receipt Generator</title>
</head>
<body>
    <div class="container">

        <h1>Maryam's Coffee Shop🍵🐻💗</h1>

        <div class="box">

            <h2>SKU Generator</h2>

            <p>Product Category:</p>

            <select id="category">
                <option value="DRI">Drinks</option>
                <option value="FOD">Food</option>
                <option value="ANK">Anik-Aniks</option>
            </select>

            <p>Product Name:</p>

            <input type="text" id="product">

            <p>Stock Quantity:</p>

            <input type="number" id="stock">

            <br>

            <button py-click="generate_sku">Generate SKU</button>

            <p>SKU:</p>

            <div id="show"></div>

            <br>

            <a href="index.html">Receipt Generator</a>

        </div>

    </div>

<py-script src="skugenerator.py"></py-script>   
</body>
</html>
